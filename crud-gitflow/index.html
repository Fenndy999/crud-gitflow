<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD de Usuarios - 1.0</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


    <h1>CRUD de Usuarios - Versión 1.0</h1>


<p class="descripcion">
    Sistema de gestión de usuarios con opciones para crear,
    editar, eliminar y administrar información.
</p>

<h1>CRUD de Usuarios</h1>


<div class="formulario">


    <input
        type="text"
        id="nombre"
        placeholder="Nombre del usuario"
    >


    <input
        type="email"
        id="correo"
        placeholder="Correo del usuario"
    >


    <button onclick="guardarUsuario()" id="btnGuardar">
        Guardar Usuario
    </button>


</div>



        <h2>Registrar Usuario</h2>


        <label for="nombre">
            Nombre completo
        </label>


        <input
            type="text"
            id="nombre"
            placeholder="Ingrese el nombre del usuario"
        >



        <label for="correo">
            Correo electrónico
        </label>


        <input
            type="email"
            id="correo"
            placeholder="Ingrese el correo del usuario"
        >



        <button onclick="guardarUsuario()" id="btnGuardar">
            Guardar Usuario
        </button>


    </div>

</div>



    <div class="dashboard">


        <h2>Panel de usuarios</h2>


        <p>
            Total de usuarios registrados:
            <strong id="totalUsuarios">0</strong>
        </p>


    </div>




    <hr>




    <h2>Lista de Usuarios</h2>




    <ul id="listaUsuarios">


<h2>Lista de Usuarios</h2>



    <script src="script.js"></script>


</body>

</html>
